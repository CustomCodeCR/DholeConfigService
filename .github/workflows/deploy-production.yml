name: Deploy Dhole Config - Production

on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: dhole-config-production
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          cloned=0
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system; then
              cloned=1
              break
            fi
            rm -rf .dhole-system
            echo "::warning::DholeSystem clone failed (attempt ${attempt}/5). Retrying after transient DNS failure."
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 5)); fi
          done
          if [ "$cloned" -ne 1 ]; then
            echo "::error::Unable to clone DholeSystem. Check DNS and HTTPS from the self-hosted runner."
            timeout 5 getent ahosts github.com || true
            cat /etc/resolv.conf || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.production" >> "$GITHUB_ENV"
      - name: Verify production server
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config -q
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Config.Api/Dockerfile -t dhole/config-api:latest -t "dhole/config-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Config.Workers/Dockerfile -t dhole/config-workers:latest -t "dhole/config-workers:$SHA_TAG" .
      - name: Deploy Config
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never config-api config-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps config-api config-workers
      - name: Verify Config API health
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps -q config-api)"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || true)" != "true" ]; then docker logs --tail 200 "$CONTAINER_ID" || true; exit 1; fi
            CONFIG_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")"
            if [ -n "$CONFIG_IP" ] && curl -fsS --max-time 2 "http://${CONFIG_IP}:8080/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs --tail 200 "$CONTAINER_ID" || true
          exit 1
      - name: Cleanup old images
        if: always()
        run: docker image prune -f
