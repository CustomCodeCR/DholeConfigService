name: Deploy Dhole Config - Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: dhole-config-staging
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  COMPOSE_OVERRIDE: .dhole-system/deploy/docker-compose.staging.yml
  DHOLE_IMAGE_TAG: staging
  DHOLE_NETWORK: dhole-staging
  COMPOSE_PROJECT: dhole-staging
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.staging" >> "$GITHUB_ENV"
      - name: Verify staging server
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" config -q
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Config.Api/Dockerfile -t dhole/config-api:staging -t "dhole/config-api:staging-$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Config.Workers/Dockerfile -t dhole/config-workers:staging -t "dhole/config-workers:staging-$SHA_TAG" .
      - name: Deploy Config staging
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never config-api config-workers
      - name: Verify Config API health
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps -q config-api)"
          test -n "$CONTAINER_ID"
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || true)" != "true" ]; then docker logs --tail 200 "$CONTAINER_ID" || true; exit 1; fi
            CONFIG_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")"
            if [ -n "$CONFIG_IP" ] && curl -fsS --max-time 2 "http://${CONFIG_IP}:8080/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs --tail 200 "$CONTAINER_ID" || true
          exit 1
      - name: Verify public pricing warehouse QR lookup
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps -q config-api)"
          test -n "$CONTAINER_ID"
          CONFIG_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")"
          test -n "$CONFIG_IP"
          LOOKUP_URL="http://${CONFIG_IP}:8080/api/config/public/pricing-warehouses/resolve?pol=Qingdao%2C%20China&shipmentMode=Fcl&route=Qingdao%2C%20China%20-%20Puerto%20Caldera%2C%20Costa%20Rica"
          RESPONSE="$(curl -fsS --max-time 10 "$LOOKUP_URL")"
          printf '%s' "$RESPONSE" | grep -q '"code":"WHS_QINGDAO"'
          printf '%s' "$RESPONSE" | grep -q '"sourceCatalog":"pricing-warehouses"'
      - name: Cleanup old images
        if: always()
        run: docker image prune -f
