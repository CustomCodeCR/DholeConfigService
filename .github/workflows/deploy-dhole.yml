name: Deploy Dhole Config

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-config-deploy
  cancel-in-progress: false

env:
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Verify server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          command -v curl >/dev/null
          test -r /opt/dhole/.env
          test -r "$COMPOSE_FILE"
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q

      - name: Build images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Config.Api/Dockerfile -t dhole/config-api:latest -t "dhole/config-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Config.Workers/Dockerfile -t dhole/config-workers:latest -t "dhole/config-workers:$SHA_TAG" .

      - name: Deploy Config
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never config-api config-workers
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps config-api config-workers

      - name: Verify Config API health
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps -q config-api)"
          test -n "$CONTAINER_ID"

          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || true)" != "true" ]; then
              echo "config-api stopped during startup"
              docker logs --tail 200 "$CONTAINER_ID" || true
              exit 1
            fi

            CONFIG_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CONTAINER_ID")"
            if [ -n "$CONFIG_IP" ] && curl -fsS --max-time 2 "http://${CONFIG_IP}:8080/health" >/dev/null; then
              echo "config-api is healthy at ${CONFIG_IP}:8080"
              exit 0
            fi

            sleep 2
          done

          echo "config-api did not become healthy"
          docker inspect "$CONTAINER_ID" || true
          docker logs --tail 200 "$CONTAINER_ID" || true
          exit 1

      - name: Cleanup old images
        if: always()
        run: docker image prune -f
